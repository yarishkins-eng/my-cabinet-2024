name: Deploy cabinet to staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: teplo-cabinet-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy-staging:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy isolated test cabinet and wait for health
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            readonly REPO_DIR='/opt/teplo-cabinet-staging'
            readonly SERVICE='cabinet-frontend-staging'
            readonly CONTAINER='teplo_staging_cabinet'
            readonly TARGET_SHA='${{ github.sha }}'
            readonly MIN_FREE_KB=2097152
            readonly STATE_DIR='/var/lib/teplo-vpn/deploy-state'
            readonly STATE_FILE="$STATE_DIR/cabinet-staging.state"
            readonly NGINX_CONF='/opt/remnawave/nginx.conf'
            readonly NGINX_CONTAINER='remnawave-nginx'
            readonly STAGING_ORIGIN='https://cabinet.lilulalu.xyz:8443'
            readonly NGINX_MARKER_BEGIN='# BEGIN teplo staging cabinet'
            readonly NGINX_MARKER_END='# END teplo staging cabinet'
            BUILD_DIR=''
            BUILD_OVERRIDE=''
            BOOTSTRAP=0
            SOURCE_SWITCHED=0
            SERVICE_SWITCH_ATTEMPTED=0
            PREVIOUS_SHA=''
            PREVIOUS_IMAGE_ID=''
            SERVICE_IMAGE=''

            compose() {
              if [ -n "$BUILD_OVERRIDE" ]; then
                docker compose -f docker-compose.staging.yml -f "$BUILD_OVERRIDE" "$@"
              else
                docker compose -f docker-compose.staging.yml "$@"
              fi
            }

            cleanup_build_context() {
              if [ -n "$BUILD_DIR" ]; then
                rm -rf "$BUILD_DIR"
              fi
            }

            create_clean_build_context() {
              BUILD_DIR="$(mktemp -d /tmp/teplo-vpn-cabinet-staging-build.XXXXXX)"
              BUILD_OVERRIDE="$BUILD_DIR/compose-build-context.yml"
              git archive "$TARGET_SHA" | tar -x -C "$BUILD_DIR"
              printf '%s\n' \
                'services:' \
                '  cabinet-frontend-staging:' \
                '    build:' \
                "      context: $BUILD_DIR" \
                '      dockerfile: Dockerfile' > "$BUILD_OVERRIDE"
            }

            verify_deployed_state() {
              test -r "$STATE_FILE"
              stored_sha="$(sed -n 's/^sha=//p' "$STATE_FILE")"
              stored_image="$(sed -n 's/^image=//p' "$STATE_FILE")"
              current_image="$(docker inspect --format '{{.Image}}' "$CONTAINER")"
              test "$stored_sha" = "$TARGET_SHA"
              test "$stored_image" = "$current_image"
              curl --fail --silent --show-error --max-time 15 http://127.0.0.1:13030/ >/dev/null
              curl --fail --silent --show-error --max-time 15 \
                --resolve cabinet.lilulalu.xyz:8443:127.0.0.1 \
                "$STAGING_ORIGIN/health/unified" >/dev/null
            }

            write_deployed_state() {
              install -d -m 700 "$STATE_DIR"
              state_tmp="$(mktemp "$STATE_DIR/cabinet-staging.XXXXXX")"
              printf 'sha=%s\nimage=%s\n' "$TARGET_SHA" "$(docker inspect --format '{{.Image}}' "$CONTAINER")" > "$state_tmp"
              chmod 600 "$state_tmp"
              mv "$state_tmp" "$STATE_FILE"
            }

            extract_cabinet_tls() {
              awk '
                /^[[:space:]]*server[[:space:]]*\{/ { inside = 1; depth = 1; target = 0; next }
                inside {
                  if ($0 ~ /^[[:space:]]*server_name[[:space:]]+cabinet\.lilulalu\.xyz/) target = 1
                  if (target && $0 ~ /^[[:space:]]*ssl_certificate(_key)?[[:space:]]/) print
                  opens = gsub(/\{/, "{")
                  closes = gsub(/\}/, "}")
                  depth += opens - closes
                  if (depth <= 0) {
                    if (target) exit
                    inside = 0
                  }
                }
              ' "$NGINX_CONF"
            }

            ensure_staging_proxy() {
              if grep -Fqx "$NGINX_MARKER_BEGIN" "$NGINX_CONF"; then
                return
              fi

              tls_directives="$(extract_cabinet_tls)"
              printf '%s\n' "$tls_directives" | awk 'NF { count += 1 } END { exit(count == 2 ? 0 : 1) }'

              backup="$NGINX_CONF.pre-teplo-staging-cabinet"
              if ! test -e "$backup"; then
                cp --preserve=mode,ownership,timestamps "$NGINX_CONF" "$backup"
              fi

              candidate="$(mktemp /tmp/teplo-staging-nginx.XXXXXX)"
              cp "$NGINX_CONF" "$candidate"
              {
                printf '\n%s\n' "$NGINX_MARKER_BEGIN"
                printf '%s\n' 'server {'
                printf '%s\n' '    listen 8443 ssl;'
                printf '%s\n' '    server_name cabinet.lilulalu.xyz;'
                printf '%s\n' "$tls_directives"
                printf '%s\n' '    add_header X-Robots-Tag "noindex, nofollow" always;'
                printf '%s\n' ''
                printf '%s\n' '    location = /health/unified {'
                printf '%s\n' '        proxy_pass http://127.0.0.1:18080/health/unified;'
                printf '%s\n' '        proxy_http_version 1.1;'
                printf '%s\n' '        proxy_set_header Host $host;'
                printf '%s\n' '        proxy_set_header X-Real-IP $remote_addr;'
                printf '%s\n' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
                printf '%s\n' '        proxy_set_header X-Forwarded-Proto $scheme;'
                printf '%s\n' '    }'
                printf '%s\n' ''
                printf '%s\n' '    location /api/ {'
                printf '%s\n' '        proxy_pass http://127.0.0.1:18080/;'
                printf '%s\n' '        proxy_http_version 1.1;'
                printf '%s\n' '        proxy_set_header Host $host;'
                printf '%s\n' '        proxy_set_header X-Real-IP $remote_addr;'
                printf '%s\n' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
                printf '%s\n' '        proxy_set_header X-Forwarded-Proto $scheme;'
                printf '%s\n' '    }'
                printf '%s\n' ''
                printf '%s\n' '    location / {'
                printf '%s\n' '        proxy_pass http://127.0.0.1:13030;'
                printf '%s\n' '        proxy_http_version 1.1;'
                printf '%s\n' '        proxy_set_header Host $host;'
                printf '%s\n' '        proxy_set_header X-Real-IP $remote_addr;'
                printf '%s\n' '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
                printf '%s\n' '        proxy_set_header X-Forwarded-Proto $scheme;'
                printf '%s\n' '    }'
                printf '%s\n' '}'
                printf '%s\n' "$NGINX_MARKER_END"
              } >> "$candidate"

              cp "$candidate" "$NGINX_CONF"
              rm -f "$candidate"
              if ! docker exec "$NGINX_CONTAINER" nginx -t; then
                cp "$backup" "$NGINX_CONF"
                docker exec "$NGINX_CONTAINER" nginx -t
                exit 70
              fi
              if ! docker exec "$NGINX_CONTAINER" nginx -s reload; then
                cp "$backup" "$NGINX_CONF"
                docker exec "$NGINX_CONTAINER" nginx -t
                docker exec "$NGINX_CONTAINER" nginx -s reload
                exit 71
              fi
            }

            rollback() {
              rc=$?
              trap - ERR
              set +e
              if [ "$SOURCE_SWITCHED" = '1' ] && [ "$BOOTSTRAP" = '0' ]; then
                git checkout --detach "$PREVIOUS_SHA"
              fi
              if [ "$SERVICE_SWITCH_ATTEMPTED" = '1' ] && [ -n "$PREVIOUS_IMAGE_ID" ]; then
                docker image tag "teplo-vpn-rollback/cabinet-staging:previous" "$SERVICE_IMAGE"
                compose up -d --no-build --wait --wait-timeout 180 "$SERVICE"
              fi
              exit "$rc"
            }

            trap cleanup_build_context EXIT

            if ! test -d "$REPO_DIR/.git"; then
              BOOTSTRAP=1
              git clone --no-tags --branch staging --single-branch \
                https://github.com/yarishkins-eng/my-cabinet-2024.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            if [ -n "$(git status --porcelain)" ]; then
              echo 'Refusing staging cabinet deploy: server source tree is dirty.' >&2
              exit 10
            fi
            if find . -maxdepth 1 -type f \( -name '*override*.yml' -o -name '*override*.yaml' \) -print -quit | grep -q .; then
              echo 'Refusing staging cabinet deploy: a Compose override is present.' >&2
              exit 11
            fi
            if [ "$(df -Pk . | awk 'NR == 2 { print $4 }')" -lt "$MIN_FREE_KB" ]; then
              echo 'Refusing staging cabinet deploy: less than 2 GiB free disk.' >&2
              exit 12
            fi

            git fetch --no-tags origin '+refs/heads/staging:refs/remotes/origin/staging'
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            REMOTE_STAGING_SHA="$(git rev-parse origin/staging)"
            if [ "$TARGET_SHA" != "$REMOTE_STAGING_SHA" ]; then
              echo "Skipping superseded staging cabinet deploy: workflow=$TARGET_SHA, origin/staging=$REMOTE_STAGING_SHA"
              exit 0
            fi
            git cat-file -e "${TARGET_SHA}^{commit}"

            if [ "$PREVIOUS_SHA" = "$TARGET_SHA" ] && test -r "$STATE_FILE"; then
              verify_deployed_state
              echo "Staging cabinet already healthy: $TARGET_SHA"
              exit 0
            fi
            if [ "$BOOTSTRAP" = '0' ] && ! git merge-base --is-ancestor "$PREVIOUS_SHA" "$TARGET_SHA"; then
              echo "Refusing staging cabinet deploy: server commit $PREVIOUS_SHA is not an ancestor of $TARGET_SHA." >&2
              exit 13
            fi

            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              PREVIOUS_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$CONTAINER")"
              SERVICE_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER")"
              docker image tag "$PREVIOUS_IMAGE_ID" 'teplo-vpn-rollback/cabinet-staging:previous'
            fi

            trap rollback ERR
            git checkout --detach "$TARGET_SHA"
            SOURCE_SWITCHED=1
            create_clean_build_context
            compose build "$SERVICE"
            SERVICE_SWITCH_ATTEMPTED=1
            compose up -d --wait --wait-timeout 180 "$SERVICE"
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:13030/ >/dev/null
            ensure_staging_proxy
            curl --fail --silent --show-error --max-time 15 \
              --resolve cabinet.lilulalu.xyz:8443:127.0.0.1 \
              "$STAGING_ORIGIN/health/unified" >/dev/null
            compose ps "$SERVICE"
            write_deployed_state

            SOURCE_SWITCHED=0
            SERVICE_SWITCH_ATTEMPTED=0
            trap - ERR
            echo "Staging cabinet healthy: $TARGET_SHA at $(date --iso-8601=seconds)"
