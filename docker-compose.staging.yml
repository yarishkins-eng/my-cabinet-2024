# Изолированный frontend для @tepl_test_bot. Не использует production container или порт 3020.
services:
  cabinet-frontend-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_TELEGRAM_BOT_USERNAME: tepl_test_bot
        VITE_APP_NAME: Teplo VPN — тест
        VITE_APP_LOGO: T
    container_name: teplo_staging_cabinet
    restart: unless-stopped
    ports:
      - '127.0.0.1:13030:80'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
