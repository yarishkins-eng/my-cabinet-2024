<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 18vh 1.5rem 2rem;
            width: 375px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.875rem;
            opacity: 0.7;
            margin-top: 1rem;
            line-height: 1.5;
        }
        .error {
            display: none;
        }
        .error.show {
            display: block;
        }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #5488f7;
            color: #fff;
            width: 100%;
            min-height: 48px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
        [hidden] { display: none !important; }
        .secondary { background: transparent; border: 1px solid #5488f7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1 id="title">Opening app...</h1>
        <div class="error show" id="errorBlock">
            <a class="btn" id="manualBtn" href="#">Open App</a>
            <p id="subtitle">Please wait</p>
            <p id="errorText" hidden></p>
            <a class="btn secondary" id="telegramBtn" hidden>Back to Telegram</a>
        </div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            const lang = (params.get('lang') || 'en').split('-')[0];
            document.documentElement.lang = lang === 'ru' ? 'ru' : 'en';
            const app = /^happ:\/\//i.test(url || '') ? 'Happ' : /^incy:\/\//i.test(url || '') ? 'INCY' : (lang === 'ru' ? 'приложение' : 'the app');
            const iosHapp = app === 'Happ' && /iphone|ipad|ipod/i.test(navigator.userAgent);

            const texts = {
                en: {
                    title: `Opening ${app}…`,
                    subtitle: 'If your phone asks, tap "Open".',
                    error: iosHapp ? 'Happ not installed yet? Go back to Telegram and choose INCY.' : `${app} not installed yet? Go back to Telegram and tap "Install".`,
                    btn: `Open ${app}`,
                    failed: 'Didn’t open?', done: 'Done. Go back to Telegram.', back: 'Back to Telegram',
                    noUrl: 'No URL provided'
                },
                ru: {
                    title: `Открываем ${app}…`,
                    subtitle: 'Если телефон спросит, нажмите «Открыть».',
                    error: iosHapp ? 'Happ ещё не установлен? Вернитесь в Telegram и выберите INCY.' : `${app} ещё не установлен? Вернитесь в Telegram и нажмите «Установить».`,
                    btn: `Открыть ${app}`,
                    failed: 'Не открылось?', done: 'Готово. Вернитесь в Telegram.', back: 'Вернуться в Telegram',
                    noUrl: 'URL не указан'
                }
            };

            const t = texts[lang] || texts.en;

            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('errorText').textContent = t.error;
            const telegramBtn = document.getElementById('telegramBtn');
            telegramBtn.textContent = t.back;
            const bot = params.get('bot') || '';
            if (/^[A-Za-z0-9_]{4,64}$/.test(bot)) {
                telegramBtn.href = `https://t.me/${bot}?startapp=conn-${crypto.randomUUID()}`;
            }
            document.getElementById('manualBtn').textContent = t.btn;

            // SECURITY: this page navigates to a user-supplied `url`. Only open
            // a custom app deep link. A bare `javascript:`/`data:`/`vbscript:`/
            // `file:` URI (DOM-XSS) is not scheme://-shaped, and http(s)/intent
            // are blocked (open redirect / intent abuse) — so only VPN app
            // schemes (happ://, vless://, ...) pass. Mirrors the validation in
            // src/pages/DeepLinkRedirect.tsx.
            function isSafeAppLink(raw) {
                var s = String(raw || '').trim().toLowerCase();
                var m = s.match(/^([a-z][a-z0-9+.\-]*):\/\//);
                if (!m) return false;
                var blocked = ['http', 'https', 'file', 'blob', 'about', 'javascript', 'data', 'vbscript', 'intent', 'content'];
                return blocked.indexOf(m[1]) === -1;
            }

            if (!url || !isSafeAppLink(url)) {
                document.getElementById('title').textContent = t.noUrl;
                document.getElementById('subtitle').textContent = '';
                document.querySelector('.spinner').style.display = 'none';
                document.getElementById('manualBtn').hidden = true;
                return;
            }

            const manualBtn = document.getElementById('manualBtn');
            manualBtn.href = url;

            let departed = false;
            let armedUntil = Date.now() + 3000;
            manualBtn.addEventListener('click', () => { armedUntil = Date.now() + 3000; });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && Date.now() <= armedUntil) departed = true;
                if (!document.hidden && departed) {
                    document.getElementById('title').textContent = t.done;
                    document.getElementById('subtitle').textContent = '';
                    document.querySelector('.spinner').hidden = true;
                    document.getElementById('errorText').hidden = true;
                    manualBtn.hidden = true;
                    telegramBtn.classList.remove('secondary');
                    telegramBtn.hidden = !telegramBtn.hasAttribute('href');
                }
            });
            setTimeout(() => {
                if (departed) return;
                document.getElementById('title').textContent = t.failed;
                document.getElementById('subtitle').textContent = '';
                document.querySelector('.spinner').hidden = true;
                document.getElementById('errorText').hidden = false;
                telegramBtn.hidden = !telegramBtn.hasAttribute('href');
            }, 3000);
            window.location.href = url;
        })();
    </script>
</body>
</html>
